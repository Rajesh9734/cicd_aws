name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EB_APPLICATION_NAME: aws_cli_setup
  EB_ENVIRONMENT_NAME: my-test-env

concurrency:
  group: elastic-beanstalk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Node.js syntax
        run: node --check app.js

      - name: Check AWS lab secrets
        env:
          AWS_ACCESS_KEY_ID_VALUE: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_VALUE: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN_VALUE: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID_VALUE" || { echo "::error::Missing repository secret AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY_VALUE" || { echo "::error::Missing repository secret AWS_SECRET_ACCESS_KEY"; exit 1; }
          test -n "$AWS_SESSION_TOKEN_VALUE" || { echo "::error::Missing repository secret AWS_SESSION_TOKEN"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ env.EB_APPLICATION_NAME }}
          environment-name: ${{ env.EB_ENVIRONMENT_NAME }}
          version-label: ${{ github.sha }}
          create-application-if-not-exists: false
          create-environment-if-not-exists: false
          wait-for-deployment: true
          wait-for-environment-recovery: true
          deployment-timeout: 1200
          exclude-patterns: .git/**,.github/**,.elasticbeanstalk/**,node_modules/**
